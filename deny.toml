[graph]
all-features = true

[advisories]
yanked = "deny"
# Temporary: sqlite-unbundled builds link the system SQLite, which the advisory
# states is not affected. cargo-deny is version-only and cannot see the feature,
# so ignore it until sqlx permits libsqlite3-sys >= 0.39.0.
ignore = ["RUSTSEC-2026-0459"]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
