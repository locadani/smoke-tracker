name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  TEST_POSTGRES_URL: postgres://postgres@localhost:5432/postgres

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: audit hash ignores serde_json map ordering
        run: cargo test -p smoke-domain --lib --features serde_json/preserve_order audit

  biome:
    name: biome (JavaScript and CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install Biome, the standalone binary
        # Pinned to a commit, not a tag: a third-party action's tags can be moved.
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.15
      - name: format and lint (biome.json)
        run: biome ci .

  accessibility:
    name: accessibility (axe, light and dark)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build the app
        working-directory: .
        run: cargo build --locked -p smoke-tracker
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: seed through the app, then axe every page at phone size
        run: npx playwright test
        env:
          SMOKE_TRACKER_BIN: ${{ github.workspace }}/target/debug/smoke-tracker
      - name: screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: |
            tests/e2e/report
            tests/e2e/results
          retention-days: 14

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install cargo-llvm-cov
        # Pinned to a commit, not a tag: a third-party action's tags can be moved.
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      - name: run the tests with coverage (SQLite and Postgres)
        run: cargo llvm-cov --workspace --locked --no-report
      - name: line coverage in the job summary
        run: |
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  sqlx:
    name: sqlx offline data
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: install sqlx-cli
        env:
          RUSTFLAGS: ""
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features sqlite,postgres,rustls,sqlx-toml
      - name: committed query metadata matches the queries and migrations
        run: scripts/sqlx-prepare.sh --check
