name: sqlx deny-resolution check

on:
  schedule:
    # Daily 06:00 UTC: catches newly-released sqlx versions so the fix lands fast.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlx-deny-resolution:
    name: Does latest sqlx resolve libsqlite3-sys >= 0.39.0?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      # Restore Cargo.lock so any later step reproduces the current tree.
      - name: Restore Cargo.lock from git
        run: git checkout -- Cargo.lock || true

      # Install cargo-deny (pinned to a commit, not a tag).
      - name: Install cargo-deny
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.14.3

      # 1. cargo-deny on the current tree should fail on RUSTSEC-2026-0459
      #    (that's the blocked state we're monitoring).
      - name: Run cargo-deny on the current tree
        id: deny-current
        continue-on-error: true
        run: cargo deny check advisories > deny-current.txt 2>&1 || true

      - name: Report current-tree deny result
        run: |
          echo "=== cargo-deny on current tree (expected FAIL) ==="
          cat deny-current.txt
          grep -q "RUSTSEC-2026-0459" deny-current.txt && echo "::notice title=Still blocked::RUSTSEC-2026-0459 still present on current tree" || echo "::notice title=Current tree clean::RUSTSEC-2026-0459 no longer present on current tree"

      # 2. Determine, WITHOUT hardcoding any sqlx version, whether the latest
      #    sqlx on crates.io permits libsqlite3-sys >= 0.39.0.
      #
      #    We build a scratch project that depends on the latest sqlx (version
      #    "*", so crates.io's absolute latest non-yanked sqlx is always probed,
      #    whatever number it lands as) with the sqlite feature enabled — the
      #    real path sqlx → sqlx-sqlite → libsqlite3-sys. We resolve against the
      #    live crates.io index (offline disabled) with no lockfile, then read
      #    the resolved libsqlite3-sys version(s) out of Cargo.lock.
      - name: Resolve latest sqlx's dependency tree against crates.io
        id: resolve-latest
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          cat > "$tmpdir/Cargo.toml" <<'TOML'
          [package]
          name = "sqlx-deny-probe"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          # Probe the latest sqlx on crates.io with the sqlite feature enabled,
          # which pulls in sqlx-sqlite → libsqlite3-sys.
          sqlx = { version = "*", default-features = false, features = ["runtime-tokio", "macros", "migrate", "sqlx-toml", "sqlite"] }
          TOML
          mkdir -p "$tmpdir/src"
          printf 'pub fn _noop() {}\n' > "$tmpdir/src/lib.rs"

          cargo generate-lockfile --manifest-path "$tmpdir/Cargo.toml" > /dev/null

          lock="$tmpdir/Cargo.lock"

          # Latest sqlx version resolved (whatever crates.io offers now).
          sqlx_ver=$(python3 - "$lock" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              data = tomllib.load(f)
          pkgs = data.get("package", [])
          sqlx = [p for p in pkgs if p.get("name") == "sqlx"]
          if not sqlx:
              print("sqlx not found in resolved tree", file=sys.stderr); sys.exit(1)
          print(sqlx[0]["version"])
          PY
          )
          echo "resolved sqlx version: $sqlx_ver"
          echo "sqlx_version=$sqlx_ver" >> "$GITHUB_OUTPUT"

          # libsqlite3-sys versions resolved anywhere in the tree.
          libs=$(python3 - "$lock" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as f:
              data = tomllib.load(f)
          pkgs = data.get("package", [])
          vers = sorted({p["version"] for p in pkgs if p.get("name") == "libsqlite3-sys"})
          print("\n".join(vers))
          PY
          )
          echo "resolved libsqlite3-sys versions:"
          echo "$libs"
          echo "libsqlite3_versions<<EOF" >> "$GITHUB_OUTPUT"
          echo "$libs" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # Does any resolved libsqlite3-sys satisfy >= 0.39.0?
          fixed=$(python3 - "$libs" <<'PY'
          import sys
          def parse(v):
              return tuple(int(x) for x in v.split("."))
          target = parse("0.39.0")
          for line in sys.argv[1].splitlines():
              line = line.strip()
              if line and parse(line) >= target:
                  print("yes"); sys.exit(0)
          print("no")
          PY
          )
          echo "fix_available=$fixed" >> "$GITHUB_OUTPUT"

      - name: Report resolution result
        run: |
          echo "Resolved sqlx: ${{ steps.resolve-latest.outputs.sqlx_version }}"
          echo "Resolved libsqlite3-sys versions:"
          echo "${{ steps.resolve-latest.outputs.libsqlite3_versions }}"
          echo "Fix available: ${{ steps.resolve-latest.outputs.fix_available }}"

      # 3. Fail (clearly) when the fix is available → triggers a GitHub
      #    notification/email on a failing workflow run.
      - name: Signal when the fix is available
        if: steps.resolve-latest.outputs.fix_available == 'yes'
        run: |
          echo "::error title=sqlx fix available::A sqlx release that permits libsqlite3-sys >= 0.39.0 is now on crates.io (resolved sqlx ${{ steps.resolve-latest.outputs.sqlx_version }}). Upgrade sqlx in Cargo.toml, remove this temporary mitigation workflow, then re-enable cargo-deny."
          exit 1
